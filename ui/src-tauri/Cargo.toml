[package]
name = "nexara-prime-desktop"
version = "0.1.0"
description = "NEXARA PRIME desktop shell"
edition = "2021"

[lib]
name = "nexara_prime_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
