name: CAB-01 isolated regression (PR 65)

# Never use the disk-blocked self-hosted Mac runner for this branch.
# Scope: test-only Linux job; no deployment, no secrets, no model calls.
on:
  push:
    branches:
      - audit/cab-guard-provenance-regressions-20261111
    paths:
      - ".github/workflows/cab65-isolated.yml"
      - "src/nexara_prime/kernel_boundary.py"
      - "src/nexara_prime/runtime.py"
      - "tests/test_cab_guard_provenance_regression.py"
      - "tests/test_cab_runtime_ingress_regression.py"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: cab65-isolated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cab-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install only declared Python test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[test]"
      - name: Run isolated CAB boundary tests
        run: |
          python -m pytest \
            tests/test_cab_guard_provenance_regression.py \
            tests/test_cab_runtime_ingress_regression.py \
            -q --tb=short --strict-markers
