name: CAB66 isolated targeted acceptance (free Linux)

# GitHub-hosted runner failed before ANY job steps on run 43066380046.
# Retain this test definition for inspection; no further auto retries.
# workflow_dispatch may require the workflow on the default branch.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cab66-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-cab:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout pinned PR branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install local test dependencies only
        run: python -m pip install --disable-pip-version-check -e ".[test]"
      - name: Real SQLite and OpenMausBot inert CLI regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q --tb=short \
            tests/integrations/test_cab01_admission.py \
            tests/integrations/test_openmausbot_execution.py \
            tests/test_cab3_sqlite_admission_reconciliation.py \
            tests/test_kernel_enforcement.py \
            tests/test_kma_cbk_recall.py \
            tests/test_cab_guard_live_authorization.py \
            tests/test_cab_guard_provenance_regression.py \
            tests/test_cab_runtime_ingress_regression.py

# No secrets, paid model API, external side effects, production database, 
# persistent service or self-hosted Mac runner. Strict XFAIL remains open.
