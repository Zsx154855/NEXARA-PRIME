name: takeover-ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [takeover/phase1]
jobs:
  quality:
    # Dedicated label so legacy workflows (NEXARA CI, sovereign-delivery) cannot
    # starve this job on the shared runner. Switch to ubuntu-latest when billing
    # is resolved.
    runs-on: [self-hosted, ci-quick]
    env:
      BOOTSTRAP_PYTHON: /opt/homebrew/bin/python3.12
      PIP_NO_INPUT: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_PROGRESS_BAR: "off"
    steps:
      - name: checkout (shell, no action download)
        run: |
          # codeload.github.com is not reachable from this host, so the
          # actions/checkout bundle cannot be downloaded. The machine already has
          # an SSH remote configured for this repository.
          git init -q .
          git remote add origin git@github-nexara:Zsx154855/NEXARA-PRIME.git 2>/dev/null \
            || git remote set-url origin git@github-nexara:Zsx154855/NEXARA-PRIME.git
          git fetch -q origin main:refs/remotes/origin/main
          git fetch -q origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          git log -1 --format='checked out %h %s' 
      - name: install
        run: |
          # Homebrew's python is externally managed (PEP 668); use a venv.
          "$BOOTSTRAP_PYTHON" -m venv .venv-ci
          # No `pip install --upgrade pip`: on this host it hangs waiting on
          # input; the venv's own pip is sufficient.
          .venv-ci/bin/python -m pip install --no-input --timeout 60 -e ".[test]" ruff
          .venv-ci/bin/python -m pip install --no-input --timeout 60 -e platform/sdk/python
          echo "NEXARA_PYTHON=$GITHUB_WORKSPACE/.venv-ci/bin/python" >> "$GITHUB_ENV"
      - name: ui build (static export)
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: ui dependency audit (no high/critical)
        working-directory: ui
        run: |
          npm audit --package-lock-only --audit-level=high

      - name: quality gate (same command as local)
        run: bash scripts/quality/gate.sh
