name: takeover-ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [takeover/phase1]
jobs:
  quality:
    # GitHub-hosted runners are blocked by an account billing lock, so this job
    # runs on the repository's registered self-hosted machine. Switch back to
    # ubuntu-latest once billing is resolved.
    runs-on: [self-hosted, macOS, ARM64]
    env:
      NEXARA_PYTHON: /opt/homebrew/bin/python3.12
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: install
        run: |
          "$NEXARA_PYTHON" -m pip install --upgrade pip
          "$NEXARA_PYTHON" -m pip install -e ".[test]" ruff
          "$NEXARA_PYTHON" -m pip install -e platform/sdk/python
      - name: compile
        run: '"$NEXARA_PYTHON" -m compileall -q src'
      - name: lint (new code)
        run: |
          ruff check src/nexara_prime/provenance_engine tests/test_t*.py scripts/
      - name: lint (changed legacy files, correctness rules only)
        run: |
          FILES=$(git diff --name-only origin/main...HEAD -- '*.py')
          [ -z "$FILES" ] || ruff check --select E9,F63,F7,F82 $FILES
      - name: tests
        run: bash scripts/test_linux.sh
      - name: coverage ratchet
        run: '"$NEXARA_PYTHON" scripts/quality/coverage_gate.py'
      - name: e2e (real http)
        run: '"$NEXARA_PYTHON" scripts/e2e/http_smoke.py'
      - name: ui route truth
        run: '"$NEXARA_PYTHON" scripts/ui/route_truth.py'
      - name: gate status
        run: '"$NEXARA_PYTHON" scripts/governance/derive_gate_status.py --check'
      - name: secret scan
        run: '"$NEXARA_PYTHON" scripts/quality/secret_scan_gate.py'
