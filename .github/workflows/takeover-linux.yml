name: takeover-ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [takeover/phase1]
jobs:
  quality:
    # GitHub-hosted runners are blocked by an account billing lock, so this job
    # runs on the repository's registered self-hosted machine. Switch back to
    # ubuntu-latest once billing is resolved.
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]" ruff
          pip install -e platform/sdk/python
      - name: compile
        run: python -m compileall -q src
      - name: lint (new code)
        run: |
          ruff check src/nexara_prime/provenance_engine tests/test_t*.py scripts/
      - name: lint (changed legacy files, correctness rules only)
        run: |
          FILES=$(git diff --name-only origin/main...HEAD -- '*.py')
          [ -z "$FILES" ] || ruff check --select E9,F63,F7,F82 $FILES
      - name: tests
        run: bash scripts/test_linux.sh
      - name: coverage ratchet
        run: python scripts/quality/coverage_gate.py
      - name: e2e (real http)
        run: python scripts/e2e/http_smoke.py
      - name: ui route truth
        run: python scripts/ui/route_truth.py
      - name: gate status
        run: python scripts/governance/derive_gate_status.py
      - name: secret scan
        run: python scripts/security/scan_hardcoded_secrets.py
