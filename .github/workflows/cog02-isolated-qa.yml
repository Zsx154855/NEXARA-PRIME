name: COG02 isolated independent verification

on:
  push:
    branches: ["work/cog02-independent-verification-20261115"]

permissions:
  contents: read

jobs:
  cognitive-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -e ".[test]" -e ./platform/sdk/python
      - name: COG02 targeted regression
        run: python -m pytest -q -p no:cacheprovider tests/test_cognitive_execution_loop.py tests/test_goal_discovery.py --tb=short
      - name: Full repository Python regression
        run: python -m pytest -q -p no:cacheprovider --tb=short
